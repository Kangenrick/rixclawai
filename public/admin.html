<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking Store API — Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#0b1020;margin:0;padding:0}
.header{background:linear-gradient(135deg,#080d19,#173367);color:#fff;padding:24px 32px}
.header h1{margin:0;font-size:1.4rem}
.header p{margin:4px 0 0;color:#c3ccdc;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:24px 32px;background:#fff;border-bottom:1px solid #dfe5ef}
.stat-card{text-align:center}
.stat-card .num{font-size:1.8rem;font-weight:900;color:#2f6bff}
.stat-card .label{color:#5f6b82;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.container{max-width:1200px;margin:auto;padding:24px 32px}
.card{background:#fff;border:1px solid #dfe5ef;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 8px rgba(11,16,32,.04)}
.card h2{font-size:1.05rem;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;border:0;font-weight:700;font-size:.78rem;cursor:pointer;transition:transform .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#2f6bff,#6a4cff);color:#fff}
.btn-secondary{background:#f0f4ff;color:#2f6bff;border:1px solid #dfe5ef}
.btn-danger{background:#fde8e8;color:#c0392b}
.btn-success{background:#e8f8f0;color:#1e8449}
.btn-warning{background:#fef9e7;color:#b7950b}
.btn-sm{padding:5px 10px;font-size:.7rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:.82rem}
td,th{padding:8px 10px;text-align:left;border-bottom:1px solid #dfe5ef;vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;color:#5f6b82;background:#f7f9fc}
.status{display:inline-block;padding:3px 8px;border-radius:99px;font-size:.68rem;font-weight:800;text-transform:uppercase}
.status-ok{background:#e8f8f0;color:#1e8449}
.status-warn{background:#fef9e7;color:#b7950b}
.status-err{background:#fde8e8;color:#c0392b}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.tag-sent{background:#e8f8f0;color:#1e8449}
.tag-pending{background:#fef9e7;color:#b7950b}
.tag-failed{background:#fde8e8;color:#c0392b}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
.modal.open{display:flex}
.modal-content{background:#fff;border-radius:20px;padding:32px;max-width:700px;width:90%;max-height:80vh;overflow:auto}
.modal-content h2{margin:0 0 16px}
pre{background:#f7f9fc;padding:16px;border-radius:8px;font-size:.78rem;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="header">
<h1>🔬 The Ranking Store — Admin Dashboard</h1>
<p>TEST_MODE enabled · All emails go to rick@therankingstore.io · No customer emails sent</p>
</div>
<div class="stats" id="health-stats">
<div class="stat-card"><div class="num" id="h-api">—</div><div class="label">API Status</div></div>
<div class="stat-card"><div class="num" id="h-db">—</div><div class="label">Database</div></div>
<div class="stat-card"><div class="num" id="h-mailgun">—</div><div class="label">Mailgun</div></div>
<div class="stat-card"><div class="num" id="h-test">—</div><div class="label">Test Mode</div></div>
<div class="stat-card"><div class="num" id="h-leads">—</div><div class="label">Total Leads</div></div>
<div class="stat-card"><div class="num" id="h-active">—</div><div class="label">Active Sequences</div></div>
</div>

<div class="container">
<div class="card">
<div class="row" style="justify-content:space-between">
<h2 style="margin:0">Leads</h2>
<div class="row">
<button class="btn btn-secondary btn-sm" onclick="refreshAll()">🔄 Refresh</button>
<button class="btn btn-primary btn-sm" onclick="createTestLead()">+ New Test Lead</button>
<button class="btn btn-secondary btn-sm" onclick="testEmail()">📧 Test Email</button>
</div>
</div>
<div id="lead-table"><p style="color:#5f6b82">Loading leads...</p></div>
</div>

<div id="lead-detail" style="display:none" class="card">
<div class="row" style="justify-content:space-between">
<h2 id="detail-title" style="margin:0">Lead Detail</h2>
<button class="btn btn-secondary btn-sm" onclick="closeDetail()">✕ Close</button>
</div>
<div id="detail-content"></div>
</div>
</div>

<script>
const API = window.location.origin;

async function api(path, opts) {
  const resp = await fetch(API + path, { headers: {'Content-Type':'application/json'}, ...opts });
  return resp.json();
}

async function refreshHealth() {
  try {
    const h = await api('/health');
    document.getElementById('h-api').textContent = h.status === 'ok' ? '✓' : '✗';
    document.getElementById('h-db').textContent = h.database?.status === 'connected' ? '✓' : '✗';
    document.getElementById('h-mailgun').textContent = h.mailgun?.configured ? '✓' : '✗';
    document.getElementById('h-test').textContent = h.testMode ? '✓' : '✗';
    document.getElementById('h-api').className = h.status === 'ok' ? 'status-ok' : 'status-err';
    document.getElementById('h-db').className = h.database?.status === 'connected' ? 'status-ok' : 'status-err';
    document.getElementById('h-mailgun').className = h.mailgun?.configured ? 'status-ok' : 'status-warn';
    document.getElementById('h-test').className = h.testMode ? 'status-ok' : 'status-warn';
  } catch(e) {
    document.getElementById('h-api').textContent = 'ERR';
    document.getElementById('h-api').className = 'status-err';
  }
}

async function refreshLeads() {
  const leads = await api('/api/leads');
  document.getElementById('h-leads').textContent = leads.length;
  const active = leads.filter(l => l.sequence_status === 'active').length;
  document.getElementById('h-active').textContent = active;

  if (!leads.length) {
    document.getElementById('lead-table').innerHTML = '<p style="color:#5f6b82">No leads yet. Create a test lead above.</p>';
    return;
  }

  let html = `<table>
    <tr><th>Business</th><th>Contact</th><th>Score</th><th>Status</th><th>Sequence</th><th>Next Step</th><th>Actions</th></tr>`;
  leads.forEach(l => {
    const stepLabels = {1:'Scan',2:'Proposal',3:'FU#1',4:'FU#2',5:'FU#3',6:'FU#4',7:'FU#5',8:'Final'};
    html += `<tr>
      <td><strong>${l.business}</strong><br><span style="color:#5f6b82;font-size:.75rem">${l.id.slice(0,12)}...</span></td>
      <td>${l.name}<br><span style="color:#5f6b82;font-size:.75rem">${l.city}, ${l.state}</span></td>
      <td><span style="font-weight:800;font-size:1.1rem">${l.scan_score ?? '—'}</span></td>
      <td><span class="status status-${l.status === 'Scan Complete' || l.status === 'Scan Sent' ? 'ok' : l.status === 'Needs Manual Review' || l.status === 'Failed' ? 'err' : 'warn'}">${l.status}</span></td>
      <td><span class="status status-${l.sequence_status === 'active' ? 'ok' : l.sequence_status === 'completed' ? 'warn' : 'err'}">${l.sequence_status || 'idle'}</span></td>
      <td>${l.next_email_step ? `Step ${l.next_email_step}: ${stepLabels[l.next_email_step] || ''}` : '—'}</td>
      <td>
        <div class="row" style="gap:4px">
          <button class="btn btn-secondary btn-sm" onclick="viewLead('${l.id}')">View</button>
          <button class="btn btn-secondary btn-sm" onclick="viewReport('${l.id}')">Report</button>
          <button class="btn btn-primary btn-sm" onclick="sendAction('${l.id}','send-scan')" ${l.scan_email_sent ? 'disabled' : ''}>Scan</button>
          <button class="btn btn-success btn-sm" onclick="sendAction('${l.id}','send-proposal')" ${l.proposal_email_sent ? 'disabled' : ''}>Proposal</button>
          <button class="btn btn-danger btn-sm" onclick="stopLead('${l.id}')">Stop</button>
        </div>
      </td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('lead-table').innerHTML = html;
}

async function viewLead(id) {
  const l = await api('/api/leads/' + id);
  document.getElementById('detail-title').textContent = l.business + ' — Full Details';
  document.getElementById('detail-content').innerHTML = `<pre>${JSON.stringify(l, null, 2)}</pre>`;
  document.getElementById('lead-detail').style.display = 'block';
}

async function viewReport(id) {
  window.open(API + '/api/leads/' + id + '/report', '_blank');
}

async function sendAction(id, action, body) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    await api('/api/leads/' + id + '/' + action, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
    refreshLeads();
  } catch(e) { alert('Error: ' + e.message); btn.disabled = false; }
}

async function stopLead(id) {
  if (!confirm('Stop this lead\'s sequence?')) return;
  await api('/api/leads/' + id + '/stop', { method: 'POST', body: JSON.stringify({reason:'stopped'}) });
  refreshLeads();
}

function closeDetail() {
  document.getElementById('lead-detail').style.display = 'none';
}

async function createTestLead() {
  const name = prompt('Contact name:', 'Test Prospect');
  if (!name) return;
  const biz = prompt('Business name:', 'ABC Roofing');
  if (!biz) return;
  const web = prompt('Website:', 'https://www.gaf.com');
  if (!web) return;
  await api('/api/scan', {
    method: 'POST',
    body: JSON.stringify({name, business: biz, website: web, email: 'rick@therankingstore.io', phone: '', industry: 'Roofing', city: 'Pottstown', state: 'PA'}),
  });
  setTimeout(refreshLeads, 5000);
}

async function testEmail() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    const r = await api('/api/admin/test-email', { method: 'POST', headers: {'Content-Type':'application/json','Authorization':'Bearer test'} });
    alert(r.success ? 'Test email sent to rick@therankingstore.io' : 'Error: ' + (r.error || 'unknown'));
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false;
  btn.textContent = '📧 Test Email';
}

async function refreshAll() {
  await Promise.all([refreshHealth(), refreshLeads()]);
}

refreshAll();
setInterval(refreshAll, 10000);
</script>
</body>
</html>
